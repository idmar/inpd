<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPD 第10讲 · 机会识别与客户需求 · 沉浸式科普展厅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   0. DESIGN TOKENS
   ========================================================= */
:root{
  --bg:#070b12; --bg2:#0b111b; --panel:#0f1622; --panel2:#131c2b;
  --line:#1c2738; --line2:#273449;
  --text:#e7edf5; --muted:#8a97aa; --dim:#5b677a;
  --blue:#4c8dff; --teal:#2fd5bf; --amber:#f5a524; --slate:#94a3b8; --red:#ff5d6c;
  --blue-a:rgba(76,141,255,.14); --teal-a:rgba(47,213,191,.14); --amber-a:rgba(245,165,36,.14);
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
  --dw:400px; --hh:60px; --ch:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
   radial-gradient(1200px 600px at 75% -10%,rgba(76,141,255,.10),transparent 60%),
   radial-gradient(900px 500px at -10% 110%,rgba(47,213,191,.07),transparent 60%),
   linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px) 0 0/32px 32px,
   linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px) 0 0/32px 32px;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}

/* =========================================================
   1. SHELL: header / stage / console / drawer / caption
   ========================================================= */
#app{position:relative;height:100%;display:grid;grid-template-rows:var(--hh) 1fr var(--ch)}
header.top{display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(7,11,18,.75);backdrop-filter:blur(10px);z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex-shrink:0}
.brand .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 0 18px rgba(76,141,255,.35)}
.brand .t1{font-weight:600;font-size:13.5px;white-space:nowrap}
.brand .t2{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
nav.tabs{flex:1;display:flex;gap:4px;justify-content:center;position:relative;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:8px 14px;border-radius:9px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:color .25s,background .25s}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--dim);transition:color .25s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab.active{color:var(--text);background:var(--panel2)}
.tab.active .n{color:var(--teal)}
.tab .soon{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--line2);color:var(--dim)}
.tab-ink{position:absolute;left:0;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:transform .5s var(--ease),width .5s var(--ease)}
.top-actions{display:flex;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;color:var(--text);transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:#3a4a63;background:var(--panel2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.primary{border-color:rgba(76,141,255,.5);background:linear-gradient(180deg,rgba(76,141,255,.22),rgba(76,141,255,.08))}
.btn.primary:hover{box-shadow:0 0 18px rgba(76,141,255,.25)}
.btn.on{border-color:var(--teal);color:var(--teal);background:var(--teal-a)}
.btn.amber{border-color:rgba(245,165,36,.5);background:var(--amber-a);color:#ffd28a}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.4;pointer-events:none}

main#main{position:relative;overflow:hidden}
#stage{position:absolute;inset:0;right:0;transition:right .5s var(--ease)}
body.drawer-open #stage{right:var(--dw)}
.stage-inner{position:absolute;inset:0;padding:18px 22px 16px;opacity:0;transform:translateY(10px) scale(.995);transition:opacity .5s var(--ease),transform .6s var(--ease)}
.stage-inner.in{opacity:1;transform:none}
.stage-inner.out{opacity:0;transform:translateY(-8px) scale(.995);transition-duration:.28s}

#drawer{position:absolute;top:0;right:0;bottom:0;width:var(--dw);background:linear-gradient(180deg,var(--panel),var(--bg2));border-left:1px solid var(--line);transform:translateX(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column;z-index:15}
body.drawer-open #drawer{transform:none;box-shadow:-30px 0 60px rgba(0,0,0,.35)}
#drawer .dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#drawer .dh .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
#drawer .dh h3{font-size:17px;font-weight:600;line-height:1.35}
#drawer .dh .x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line2);flex-shrink:0}
#drawer .dh .x:hover{color:var(--text)}
#drawer .db{padding:16px 20px 28px;overflow:auto;flex:1}
.db p{color:#c8d2df;margin-bottom:12px;font-size:13.5px}
.db h4{font-size:12px;font-family:var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:18px 0 8px}
.db ul{list-style:none;margin-bottom:10px}
.db li{position:relative;padding-left:16px;margin-bottom:7px;color:#c8d2df;font-size:13.3px}
.db li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--accent,var(--teal))}
.db .quote{border-left:2px solid var(--amber);padding:10px 12px;background:var(--amber-a);border-radius:0 8px 8px 0;color:#ffe2b3;font-size:13.3px;margin:10px 0 14px}
.db .meter{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.db .meter i{display:block;height:100%;border-radius:4px;width:0;transition:width .9s var(--ease) .15s}
.db .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin-bottom:12px}
.db .kv b{color:var(--muted);font-weight:500}
.db .chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;border:1px solid var(--line2);color:var(--muted);margin:0 4px 4px 0}
.db > *{animation:rise .5s var(--ease) both}
.db > *:nth-child(2){animation-delay:.04s}.db > *:nth-child(3){animation-delay:.08s}.db > *:nth-child(4){animation-delay:.12s}.db > *:nth-child(5){animation-delay:.16s}.db > *:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

footer.console{display:flex;align-items:center;gap:16px;padding:0 20px;border-top:1px solid var(--line);background:rgba(7,11,18,.8);backdrop-filter:blur(10px);z-index:20}
.console .where{display:flex;align-items:baseline;gap:10px;min-width:0;flex-shrink:0}
.console .where .idx{font-family:var(--mono);color:var(--teal);font-size:12px}
.console .where .nm{font-size:13px;font-weight:500;white-space:nowrap}
.console .where .en{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
#consoleSlot{flex:1;display:flex;gap:8px;justify-content:center;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.console .nav{display:flex;gap:6px;align-items:center;flex-shrink:0}
.dots{display:flex;gap:5px;margin:0 6px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width .4s var(--ease),background .3s}
.dots i.on{width:18px;background:var(--teal)}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);transition:color .2s,border-color .2s}
.iconbtn:hover{color:var(--text);border-color:#3a4a63}
.iconbtn svg{width:16px;height:16px}

#caption{position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);max-width:min(760px,calc(100% - 40px));padding:12px 18px 12px 16px;border-radius:12px;background:rgba(11,17,27,.88);border:1px solid var(--line2);backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .5s var(--ease);z-index:12}
#caption.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#caption .rec{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.4s infinite;flex-shrink:0}
#caption.hint .rec{background:var(--teal);box-shadow:0 0 10px var(--teal);animation:none}
#caption .txt{font-size:13.5px;color:#dbe4ef}
#caption .bar{position:absolute;left:12px;right:12px;bottom:4px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
#caption .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .4s linear}
#caption.hint .bar{display:none}
@keyframes blink{50%{opacity:.25}}

/* generic panels */
.panel{background:linear-gradient(180deg,rgba(19,28,43,.85),rgba(15,22,34,.85));border:1px solid var(--line);border-radius:14px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h-title{font-size:20px;font-weight:600;letter-spacing:-.01em}
.h-sub{color:var(--muted);font-size:12.5px}

/* =========================================================
   2. MODULE 1 — Opportunity Matrix
   ========================================================= */
.m1{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.m1-plot{position:relative;min-height:0;display:flex;flex-direction:column}
.m1-plot .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.m1-plot svg{flex:1;min-height:0;width:100%;touch-action:none;user-select:none}
.m1-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:70px}
.hud{padding:16px}
.hud .lvl{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
.hud .lvl .big{font-size:40px;font-weight:700;font-family:var(--mono);line-height:1;transition:color .4s}
.hud .lvl .lab{font-size:14px;font-weight:600;transition:color .4s}
.hud .desc{color:var(--muted);font-size:12.5px;min-height:38px}
.hud .coords{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hud .coords div{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.hud .coords b{display:block;font-family:var(--mono);font-size:15px;font-weight:500}
.hud .coords span{font-size:11px;color:var(--muted)}
.risk{margin-top:12px}
.risk .rb{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.risk .rb i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--blue),var(--amber));transition:width .35s var(--ease)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.quiz{padding:16px;display:none}
.quiz.show{display:block;animation:rise .5s var(--ease)}
.quiz .q{font-size:14px;font-weight:500;margin:6px 0 10px}
.quiz .fb{margin-top:10px;font-size:12.5px;padding:9px 11px;border-radius:9px;display:none}
.quiz .fb.ok{display:block;background:var(--teal-a);color:#a9f3e8;border:1px solid rgba(47,213,191,.35)}
.quiz .fb.no{display:block;background:rgba(255,93,108,.1);color:#ffb3ba;border:1px solid rgba(255,93,108,.3)}
.legend-row{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:3px}
.pin{cursor:pointer}
.pin .pc{transition:r .25s var(--ease)}
.pin:hover .pc{r:9}
.pin text{pointer-events:none}

/* =========================================================
   3. MODULE 2 — Opportunity Generation Radar
   ========================================================= */
.m2{height:100%;display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:18px}
.m2-left{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:70px}
.donut-wrap{padding:16px}
.donut-wrap svg{width:100%;max-width:220px;display:block;margin:6px auto 4px}
.seg{cursor:pointer;transition:stroke-width .3s var(--ease),opacity .3s}
.seg.dim{opacity:.3}
.src-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.src-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:background .2s}
.src-item:hover,.src-item.on{background:rgba(255,255,255,.04)}
.src-item i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.src-item b{margin-left:auto;font-family:var(--mono);font-weight:500}
.ie-bar{padding:14px 16px}
.ie-bar .track{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.ie-bar .track i{display:block;height:100%;width:0;transition:width 1.2s var(--ease)}
.ie-bar .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.m2-wheel{position:relative;min-height:0;display:flex;flex-direction:column}
.m2-wheel svg{flex:1;min-height:0;width:100%}
.wnode{cursor:pointer}
.wnode .ring{transition:stroke .3s,stroke-width .3s}
.wnode .core{transition:fill .3s}
.wnode:hover .ring{stroke:var(--teal)}
.wnode.sel .ring{stroke:var(--teal);stroke-width:2.5}
.wnode.sel .core{fill:rgba(47,213,191,.18)}
.wnode.linked .ring{stroke:var(--amber);stroke-width:2.5}
.wnode .pulse{opacity:0}
.wnode.sel .pulse{animation:npulse 1.8s var(--ease) infinite}
@keyframes npulse{0%{opacity:.7;r:34}100%{opacity:0;r:62}}
.m2-right{min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:70px}
.flip{perspective:1400px;flex:1;min-height:340px}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s var(--ease)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(160deg,#142036,#0d1420 60%);padding:18px;display:flex;flex-direction:column;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .num{font-family:var(--mono);font-size:11px;color:var(--teal);letter-spacing:.08em}
.face h3{font-size:18px;font-weight:600;margin:4px 0 2px}
.face .en{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:10px}
.face .lead{font-size:12.5px;color:#b8c3d2;margin-bottom:10px}
.face .anim{flex:1;min-height:150px;position:relative;border-radius:12px;background:rgba(7,11,18,.55);border:1px solid var(--line);overflow:hidden}
.face .foot{margin-top:10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.face.idle{align-items:center;justify-content:center;text-align:center}
.face.idle .big7{font-size:76px;font-weight:700;font-family:var(--mono);background:linear-gradient(135deg,var(--blue),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}

/* mini animations inside cards */
.wc-word{position:absolute;white-space:nowrap;font-weight:600;opacity:0;animation:wcIn .7s var(--ease) forwards, wcFloat 4s ease-in-out infinite alternate}
@keyframes wcIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes wcFloat{from{translate:0 0}to{translate:0 -6px}}
.vrio-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;margin:6px 8px;background:rgba(255,255,255,.02);border:1px solid var(--line);opacity:0;animation:rowIn .5s var(--ease) forwards}
.vrio-row .L{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;background:var(--blue-a);color:var(--blue);flex-shrink:0}
.vrio-row .ck{margin-left:auto;color:var(--teal);opacity:0;animation:fadeIn .3s forwards}
.vrio-row small{color:var(--muted);font-size:11px;display:block}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
.tl{position:absolute;inset:12px 14px}
.tl-step{position:relative;padding:0 0 9px 22px;opacity:0;animation:rowIn .5s var(--ease) forwards;font-size:12px}
.tl-step::before{content:"";position:absolute;left:4px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--teal)}
.tl-step::after{content:"";position:absolute;left:8.5px;top:16px;bottom:-1px;width:1px;background:var(--line2)}
.tl-step:last-child::after{display:none}
.tl-step b{color:var(--text);font-weight:600}
.tl-step span{color:var(--muted)}
.tl-step.hl::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px var(--amber)}
.tr-row{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:6px;margin:7px 10px;opacity:0;animation:rowIn .5s var(--ease) forwards;font-size:11.8px}
.tr-row .a{padding:6px 8px;border-radius:7px;background:var(--blue-a);color:#bcd3ff;border:1px solid rgba(76,141,255,.25)}
.tr-row .b{padding:6px 8px;border-radius:7px;background:var(--teal-a);color:#b4f5ec;border:1px solid rgba(47,213,191,.25)}
.tr-row .arr{height:1px;background:linear-gradient(90deg,var(--blue),var(--teal));position:relative}
.tr-row .arr::after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid var(--teal);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.cmp .c{border-radius:9px;padding:9px;border:1px solid var(--line);font-size:11.8px;opacity:0;animation:rowIn .5s var(--ease) forwards}
.cmp .c h5{font-size:12px;margin-bottom:5px}
.cmp .c.old{background:rgba(255,255,255,.02);color:var(--muted)}
.cmp .c.new{background:var(--teal-a);border-color:rgba(47,213,191,.3);color:#c5f6ee}
.tactics{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.tactics span{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--amber-a);color:#ffd28a;border:1px solid rgba(245,165,36,.3);opacity:0;animation:rowIn .5s var(--ease) forwards}

/* placeholder */
.ph{height:100%;display:grid;place-items:center}
.ph-card{max-width:760px;width:100%;padding:28px 30px}
.ph-card .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.ph-card .grid div{padding:12px 14px;border-radius:10px;background:var(--bg2);border:1px dashed var(--line2);font-size:12.5px;color:#c8d2df}
.ph-card pre{font-family:var(--mono);font-size:11.5px;color:#9fb3cc;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre}

/* =========================================================
   4. MODULE 3 — Opportunity Tournament / Funnel
   ========================================================= */
.m3{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.m3-main{min-height:0;display:flex;flex-direction:column}
.m3-main svg{flex:1;min-height:0;width:100%}
.m3-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:70px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px}
.counts div{text-align:center;padding:8px 2px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);transition:border-color .4s,box-shadow .4s}
.counts div.on{border-color:currentColor;box-shadow:0 0 16px -6px currentColor}
.counts b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.2}
.counts span{font-size:10.5px;color:var(--muted)}
.proc{display:flex;gap:4px;padding:0 14px 14px;flex-wrap:wrap}
.proc span{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--dim);transition:all .4s var(--ease)}
.proc span.on{border-color:var(--teal);color:var(--teal);background:var(--teal-a)}
.proc span.done{color:var(--muted)}
.crit{padding:14px 16px}
.crit .ct{font-size:14px;font-weight:600;margin:4px 0 6px}
.crit ul{list-style:none}
.crit li{font-size:12.5px;color:#c8d2df;padding:3px 0 3px 16px;position:relative}
.crit li::before{content:"";position:absolute;left:2px;top:.75em;width:6px;height:6px;border-radius:2px;background:var(--cc,var(--teal))}
.log{padding:14px 16px;flex:1;min-height:150px;overflow:hidden}
.log ul{list-style:none;margin-top:6px}
.log li{font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:baseline;animation:rise .4s var(--ease)}
.log li i{width:7px;height:7px;border-radius:2px;flex-shrink:0;transform:translateY(-1px)}
.log li b{color:#c8d2df;font-weight:500;font-family:var(--mono);font-size:11px}
.mission{padding:14px 16px;display:none;border-color:rgba(245,165,36,.45);background:linear-gradient(180deg,rgba(245,165,36,.10),rgba(15,22,34,.9))}
.mission.show{display:block;animation:rise .6s var(--ease)}
.mission .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin-top:8px}
.mission .kv b{color:#ffd28a;font-weight:500}
.p3{transition:fill .5s,stroke .5s}
.lbl3{transition:opacity .5s}

/* =========================================================
   5. MODULE 4 — Disruptive vs Incremental
   ========================================================= */
.m4{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}
.m4-main{min-height:0;display:flex;flex-direction:column}
.m4-main svg.chart{flex:1;min-height:0;width:100%}
.m4-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:70px}
.slider-row{display:flex;align-items:center;gap:14px;padding:10px 14px;margin-bottom:62px}
.slider-row .sv{font-family:var(--mono);font-size:13px;min-width:46px;text-align:right;color:var(--teal)}
input[type=range].rng{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--teal) var(--p,0%),var(--line) var(--p,0%));outline:none;cursor:pointer}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#0b111b;border:2px solid var(--teal);box-shadow:0 0 0 5px rgba(47,213,191,.15),0 0 14px rgba(47,213,191,.5);cursor:grab}
input[type=range].rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#0b111b;border:2px solid var(--teal);cursor:grab}
.bal{padding:12px 14px}
.bal svg{width:100%;display:block}
.attn{padding:14px 16px}
.attn .row{display:grid;grid-template-columns:76px 1fr 38px;gap:8px;align-items:center;font-size:12px;margin-top:7px}
.attn .row .tr{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.attn .row .tr i{display:block;height:100%;border-radius:4px;transition:width .25s linear}
.attn .row b{font-family:var(--mono);font-weight:500;text-align:right;color:var(--muted);font-size:11.5px}
.attn svg{width:100%;display:block;margin-top:8px}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px}
.case{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);text-align:left;transition:border-color .25s,transform .25s var(--ease)}
.case:hover{transform:translateY(-2px);border-color:#3a4a63}
.case svg{width:100%;height:42px}
.case b{font-size:12.5px;font-weight:600}
.case span{font-size:10.5px;font-family:var(--mono)}
@media (max-width:900px){.m3,.m4{grid-template-columns:1fr;height:auto}.m3-main svg,.m4-main svg.chart{height:56vh;flex:none}}

/* =========================================================
   6. MODULE 5 — Customer Needs Pipeline
   ========================================================= */
.m5{height:100%;display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;padding:10px 16px;gap:0}
.sn{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:10px;cursor:pointer;flex-shrink:0;transition:background .3s}
.sn:hover{background:rgba(255,255,255,.03)}
.sn .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;border:1.5px solid var(--line2);color:var(--muted);background:var(--bg2);transition:all .45s var(--ease)}
.sn .tx b{display:block;font-size:13px;font-weight:600;color:var(--muted);transition:color .3s;white-space:nowrap}
.sn .tx span{font-size:10.5px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.sn.done .dot{border-color:var(--teal);color:var(--teal)}
.sn.on .dot{border-color:var(--teal);background:var(--teal);color:#04131a;box-shadow:0 0 0 5px rgba(47,213,191,.15),0 0 18px rgba(47,213,191,.45)}
.sn.on .tx b{color:var(--text)}
.sline{flex:1;height:2px;background:var(--line2);margin:0 6px;border-radius:2px;overflow:hidden;min-width:16px}
.sline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .6s var(--ease)}
.m5-body{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;opacity:0;transform:translateX(18px);transition:opacity .45s var(--ease),transform .55s var(--ease)}
.pane.in{opacity:1;transform:none}
.pane.out{opacity:0;transform:translateX(-18px)}
.pane-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;gap:12px}
.seg-ctl{display:inline-flex;padding:3px;border-radius:9px;background:var(--bg2);border:1px solid var(--line2)}
.seg-ctl button{padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--muted);transition:all .25s}
.seg-ctl button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}

/* step 1 */
.s1{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:14px;height:calc(100% - 46px)}
.s1 .col{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding-bottom:64px}
.mcard{padding:12px 14px;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;opacity:0;animation:rowIn .5s var(--ease) forwards}
.mcard svg{width:58px;height:46px}
.mcard b{font-size:13px}
.mcard p{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.umap{display:flex;flex-direction:column;padding:12px 14px;min-height:0}
.umap svg{flex:1;min-height:0;width:100%}
.umap .info{font-size:12.5px;color:#c8d2df;min-height:40px;padding:8px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);margin-bottom:58px;transition:border-color .3s}
.rec{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:9px 12px;font-size:12px;opacity:0;animation:rowIn .5s var(--ease) forwards}
.rec .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--blue-a);color:var(--blue);font-size:12px}
.rec b{font-size:12.5px}
.rec small{display:block;color:var(--muted);font-size:11px;line-height:1.45}
.outbox{padding:11px 13px;font-size:12px;border-color:rgba(47,213,191,.35);background:linear-gradient(180deg,rgba(47,213,191,.08),rgba(15,22,34,.9));color:#c5f6ee}

/* step 2 */
.s2{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;height:calc(100% - 46px)}
.rules{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-bottom:64px}
.rule{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);text-align:left;transition:all .3s var(--ease)}
.rule:hover{border-color:#3a4a63}
.rule .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;background:var(--bg2);color:var(--muted);transition:all .3s}
.rule b{font-size:13px;display:block}
.rule small{font-size:11px;color:var(--muted)}
.rule.on{border-color:var(--teal);background:linear-gradient(90deg,rgba(47,213,191,.12),var(--panel))}
.rule.on .n{background:var(--teal);color:#04131a}
.s2-stage{padding:18px 22px;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-bottom:70px}
.bubble{position:relative;align-self:flex-start;max-width:88%;padding:12px 16px;border-radius:14px 14px 14px 4px;background:var(--panel2);border:1px solid var(--line2);font-size:15px;color:#e7edf5}
.bubble::before{content:"顾客";position:absolute;top:-9px;left:12px;font-size:10px;padding:0 6px;border-radius:4px;background:var(--blue);color:#fff}
.flowarrow{height:34px;position:relative;margin-left:30px}
.flowarrow::before{content:"";position:absolute;left:0;top:0;bottom:6px;width:2px;background:linear-gradient(var(--blue),var(--teal))}
.flowarrow::after{content:"";position:absolute;left:-4px;bottom:0;border-top:7px solid var(--teal);border-left:5px solid transparent;border-right:5px solid transparent}
.flowarrow span{position:absolute;left:14px;top:7px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.tgl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tgl{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.tgl .sw{width:46px;height:24px;border-radius:12px;background:rgba(255,93,108,.25);border:1px solid rgba(255,93,108,.5);position:relative;transition:all .35s var(--ease)}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--red);transition:all .35s var(--ease)}
.tgl.ok .sw{background:rgba(47,213,191,.22);border-color:rgba(47,213,191,.5)}
.tgl.ok .sw::after{left:24px;background:var(--teal)}
.tgl .l1{color:var(--red)}.tgl.ok .l1{color:var(--muted)}
.tgl .l2{color:var(--muted)}.tgl.ok .l2{color:var(--teal)}
.ncard{position:relative;padding:16px 18px 14px;border-radius:14px;border:1px solid rgba(255,93,108,.45);background:linear-gradient(180deg,rgba(255,93,108,.08),rgba(15,22,34,.9));transition:border-color .5s,background .5s}
.ncard.ok{border-color:rgba(47,213,191,.5);background:linear-gradient(180deg,rgba(47,213,191,.09),rgba(15,22,34,.9))}
.ncard .tagl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--red)}
.ncard.ok .tagl{color:var(--teal)}
.ncard .ntext{font-size:19px;font-weight:600;margin:6px 0 10px;transition:opacity .35s,filter .35s,transform .35s}
.ncard .ntext.swap{opacity:0;filter:blur(6px);transform:translateY(4px)}
.ncard mark{background:none;color:inherit;padding:0 2px;border-radius:4px;transition:all .4s}
.ncard mark.bad{background:rgba(255,93,108,.2);box-shadow:inset 0 -2px 0 var(--red);color:#ffc2c8}
.ncard mark.bad.strike{text-decoration:line-through;text-decoration-color:var(--red);opacity:.6}
.ncard mark.good{background:rgba(47,213,191,.18);box-shadow:inset 0 -2px 0 var(--teal);color:#c5f6ee}
.ncard .why{font-size:12.5px;color:#c8d2df;display:flex;gap:8px;align-items:flex-start}
.ncard .why i{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:var(--red);color:#fff;margin-top:1px}
.ncard.ok .why i{background:var(--teal);color:#04131a}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{padding:10px 12px;border-radius:10px;font-size:12.5px;border:1px dashed var(--line2);color:var(--muted)}
.pair div b{display:block;font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;margin-bottom:3px}
.conflict{display:flex;gap:12px;align-items:center;padding:10px 14px;font-size:12.5px;color:#c8d2df}
.conflict .vs{display:flex;gap:6px;flex-shrink:0}
.conflict .vs span{padding:3px 8px;border-radius:6px;font-size:11px;border:1px solid var(--line2)}
.conflict .vs span.y{border-color:var(--teal);color:var(--teal);background:var(--teal-a)}
.conflict .vs span.n{text-decoration:line-through;color:var(--dim)}

/* step 3 */
.s3{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;height:calc(100% - 46px)}
.board{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0) 0 0/18px 18px, var(--bg2);margin-bottom:62px}
.note{position:absolute;width:23%;min-height:13%;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4;color:#1a1f29;background:#f4e7b4;box-shadow:0 6px 16px rgba(0,0,0,.35);opacity:0;transform:scale(.6);
  transition:left .9s var(--ease),top .9s var(--ease),transform .9s var(--ease),opacity .5s,background .6s,box-shadow .6s}
.note.show{opacity:1}
.note.g0{background:#bff3ea}.note.g1{background:#cfe0ff}.note.g2{background:#ffe2b0}
.note.gone{opacity:0!important;transform:scale(.4) rotate(18deg)!important}
.note.shake{animation:shake .5s 2;background:#ffc7cd}
.note .ck{position:absolute;right:6px;bottom:4px;font-size:11px;color:#0a7a6a;opacity:0;transition:opacity .4s}
.note.rv .ck{opacity:1}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}
.gh{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12.5px;font-weight:600;opacity:0;transform:translateY(-8px);transition:opacity .5s,transform .6s var(--ease)}
.gh.show{opacity:1;transform:none}
.gh.sec{height:8.5%;border:1px solid currentColor;background:rgba(11,17,27,.8)}
.gh.pri{height:8.5%;color:#04131a}
.sweep{position:absolute;top:0;bottom:0;width:23.5%;border-radius:10px;background:linear-gradient(90deg,transparent,rgba(47,213,191,.18),transparent);opacity:0;pointer-events:none}
.six{padding:14px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto;margin-bottom:62px}
.six .st{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start;padding:7px 8px;border-radius:9px;font-size:12.5px;color:var(--muted);transition:all .35s}
.six .st i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);transition:all .35s}
.six .st.on{background:var(--teal-a);color:var(--text)}
.six .st.on i{background:var(--teal);color:#04131a;border-color:var(--teal)}
.six .st.done i{color:var(--teal);border-color:var(--teal)}

/* step 4 */
.s4{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;height:calc(100% - 46px)}
.s4 .plot{padding:10px 12px;display:flex;flex-direction:column;min-height:0;margin-bottom:62px}
.s4 .plot svg{flex:1;min-height:0;width:100%}
.s4 .side{display:flex;flex-direction:column;gap:10px;overflow:auto;padding-bottom:64px}
.kcurve{cursor:pointer}
.kinfo{padding:14px 16px}
.kinfo h4{font-size:16px;margin:4px 0 2px}
.kinfo .en{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.kinfo p{font-size:12.5px;color:#c8d2df;margin-top:8px}
.kinfo .ex{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:12px;background:var(--bg2);border:1px solid var(--line)}
.cbar{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:12px;margin-top:8px}
.cbar .tr{position:relative;height:10px;border-radius:5px;background:var(--line)}
.cbar .tr::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#5b677a}
.cbar .tr i{position:absolute;top:0;bottom:0;border-radius:5px}
.cbar b{font-family:var(--mono);font-weight:500;font-size:11.5px;text-align:right}
.alloc .row{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px;margin-top:7px}
.alloc .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.alloc .tr i{display:block;height:100%;border-radius:4px;transition:width .9s var(--ease),background .6s}
.alloc b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);text-align:right}
.ipt{cursor:pointer}

/* step 5 */
.s5{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;height:calc(100% - 46px)}
.ringp{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin-bottom:62px;text-align:center}
.ringp svg{width:180px;height:180px}
.clist{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-bottom:70px}
.ci{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;font-size:13.3px;color:#c8d2df;transition:all .3s var(--ease);opacity:0;animation:rowIn .5s var(--ease) forwards}
.ci:hover{border-color:#3a4a63}
.ci .bx{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .3s}
.ci .bx svg{width:14px;height:14px;stroke:#04131a;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .1s}
.ci.on{border-color:rgba(47,213,191,.4);background:linear-gradient(90deg,rgba(47,213,191,.1),var(--panel));color:var(--text)}
.ci.on .bx{background:var(--teal);border-color:var(--teal)}
.ci.on .bx svg{stroke-dashoffset:0}
@media (max-width:1100px){.s1{grid-template-columns:1fr 1fr}.s1 .col:last-child{grid-column:1/-1}.stepper .tx span{display:none}}
@media (max-width:900px){.m5{height:auto}.m5-body{min-height:1100px}.s1,.s2,.s3,.s4,.s5{grid-template-columns:1fr;height:auto}.stepper{overflow-x:auto}.stepper .tx{display:none}.board{height:520px}.s4 .plot svg,.umap svg{height:50vh;flex:none}}

/* responsive */
@media (max-width:1180px){
  .m2{grid-template-columns:240px minmax(0,1fr)}
  .m2-right{grid-column:1/-1;flex-direction:row;padding-bottom:70px}
  .flip{min-height:330px}
}
@media (max-width:900px){
  :root{--dw:100%}
  body{overflow:auto}
  .brand .t2,.console .where .en{display:none}
  .stage-inner{overflow:auto}
  .m1,.m2{grid-template-columns:1fr;height:auto}
  .m1-plot svg,.m2-wheel svg{height:62vh;flex:none}
  .m2-right{flex-direction:column}
  body.drawer-open #stage{right:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

      </button>
    </div>

        <button class="x" id="dClose" aria-label="关闭"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="db" id="dBody"></div>
    </aside>

  <footer class="console">
    <div class="where"><span class="idx" id="cIdx">01</span><span class="nm" id="cName"></span><span class="en" id="cEn"></span></div>
    <div id="consoleSlot"></div>
    <div class="nav">
      <button class="iconbtn" id="prevBtn" aria-label="上一章"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="dots" id="dots"></div>
      <button class="iconbtn" id="nextBtn" aria-label="下一章"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </footer>
</div>

<script>
/* =====================================================================
   NPD EXHIBIT CORE  ·  模块化展厅框架
   ---------------------------------------------------------------------
   扩展接口（后续模块 3/4/5 直接调用即可替换占位）：

   NPD.registerModule({
     id:'m3', index:3, title:'机会漏斗筛选', en:'Opportunity Tournament',
     mount(ctx){            // 进入章节时调用
       ctx.stage            // 本章根节点 (HTMLElement)
       ctx.console          // 底部控制台插槽 (HTMLElement)
       ctx.drawer.open({tag,title,html,accent}) / ctx.drawer.close()
       ctx.caption(text, {hint:true})          // 字幕条
       ctx.loop((t,dt)=>{})                    // rAF 循环，离开章节自动清理
       ctx.tween(ms,(p)=>{},ease)              // 返回 Promise 的补间
       ctx.wait(ms)                            // Tour 中可被中断的等待
       ctx.on(el,'click',fn)                   // 自动解绑的事件
       ctx.svg(tag,attrs,parent) / ctx.h(html) // DOM 辅助
       return {
         tour: async (ctx)=>{ ... },           // 自动演示脚本（可选）
         unmount(){ ... }                      // 额外清理（可选）
       };
     }
   });
   ===================================================================== */
const NPD = (() => {
  const $ = s => document.querySelector(s);
  const SVGNS = 'http://www.w3.org/2000/svg';
  const modules = [];
  let cur = null, curIdx = -1, cleanups = [], loops = [], rafId = 0, lastT = 0;
  let tourToken = 0, touring = false, switching = false;

  const ease = {
    io: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2,
    out: t => 1 - Math.pow(1-t, 3),
    lin: t => t
  };

  /* ---------- helpers ---------- */
  function svg(tag, attrs = {}, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

  /* ---------- rAF master loop ---------- */
  function frame(t) {
    const dt = Math.min(64, t - (lastT || t)); lastT = t;
    for (const f of loops.slice()) f(t, dt);
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);

  /* ---------- drawer ---------- */
  const drawer = {
    open({ tag = '', title = '', html = '', accent = 'var(--teal)' }) {
      $('#dTag').textContent = tag; $('#dTag').style.color = accent;
      $('#dTitle').textContent = title;
      const b = $('#dBody'); b.style.setProperty('--accent', accent);
      b.innerHTML = html; b.scrollTop = 0;
      document.body.classList.add('drawer-open');
      requestAnimationFrame(() => b.querySelectorAll('.meter i[data-w]').forEach(i => i.style.width = i.dataset.w));
    },
    close() { document.body.classList.remove('drawer-open'); },
    get isOpen() { return document.body.classList.contains('drawer-open'); }
  };
  $('#dClose').onclick = () => drawer.close();

  /* ---------- caption ---------- */
  let capTimer = 0;
  function caption(text, opt = {}) {
    const c = $('#caption'); clearTimeout(capTimer);
    if (!text) { c.classList.remove('show'); return; }
    c.querySelector('.txt').textContent = text;
    c.classList.toggle('hint', !!opt.hint);
    c.classList.add('show');
    if (opt.hint) capTimer = setTimeout(() => c.classList.remove('show'), opt.ms || 3800);
  }
  function tourProgress(p) { $('#caption .bar i').style.width = (p*100).toFixed(1) + '%'; }

  /* ---------- module context ---------- */
  function makeCtx(root) {
    return {
      stage: root, console: $('#consoleSlot'), drawer, caption, svg, h, ease,
      loop(fn) { loops.push(fn); cleanups.push(() => { loops = loops.filter(f => f !== fn); }); },
      on(el, ev, fn, o) { el.addEventListener(ev, fn, o); cleanups.push(() => el.removeEventListener(ev, fn, o)); },
      tween(ms, fn, e = ease.io) {
        return new Promise(res => {
          const t0 = performance.now();
          const step = now => {
            const p = Math.min(1, (now - t0) / ms); fn(e(p));
            if (p < 1) { const id = requestAnimationFrame(step); cleanups.push(() => cancelAnimationFrame(id)); } else res();
          };
          requestAnimationFrame(step);
        });
      },
      wait(ms) {
        const tok = tourToken;
        return new Promise((res, rej) => {
          const id = setTimeout(() => (tok === tourToken && touring) ? res() : rej('cancel'), ms);
          cleanups.push(() => clearTimeout(id));
        });
      },
      get touring() { return touring; }
    };
  }

  /* ---------- tabs ---------- */
  function renderTabs() {
    const nav = $('#tabs'); const ink = $('#tabInk');
    nav.querySelectorAll('.tab').forEach(t => t.remove());
    modules.forEach((m, i) => {
      const b = h(`<button class="tab" data-i="${i}"><span class="n">0${m.index}</span><span>${m.title}</span>${m.placeholder ? '<span class="soon">待续</span>' : ''}</button>`);
      b.onclick = () => { stopTour(); go(i); };
      nav.insertBefore(b, ink);
    });
    $('#dots').innerHTML = modules.map(() => '<i></i>').join('');
    markTabs();
  }
  function markTabs() {
    const tabs = [...document.querySelectorAll('.tab')];
    tabs.forEach((t, i) => t.classList.toggle('active', i === curIdx));
    const a = tabs[curIdx], ink = $('#tabInk');
    if (a) { ink.style.width = a.offsetWidth - 20 + 'px'; ink.style.transform = `translateX(${a.offsetLeft + 10}px)`; }
    [...document.querySelectorAll('#dots i')].forEach((d, i) => d.classList.toggle('on', i === curIdx));
  }
  window.addEventListener('resize', markTabs);

  /* ---------- navigation ---------- */
  async function go(i) {
    if (i < 0 || i >= modules.length || switching) return cur;
    if (i === curIdx && cur) return cur;
    switching = true;
    const stage = $('#stage');
    const old = stage.querySelector('.stage-inner');
    if (old) { old.classList.remove('in'); old.classList.add('out'); await new Promise(r => setTimeout(r, 260)); }
    // cleanup old module
    cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; loops = [];
    if (cur && cur.api && cur.api.unmount) try { cur.api.unmount(); } catch (e) {}
    drawer.close(); if (!touring) caption('');
    stage.innerHTML = ''; $('#consoleSlot').innerHTML = '';
    // mount new
    curIdx = i; const m = modules[i];
    const root = h('<div class="stage-inner"></div>'); stage.appendChild(root);
    const ctx = makeCtx(root);
    const api = (m.mount && m.mount(ctx)) || {};
    cur = { m, api, ctx };
    $('#cIdx').textContent = '0' + m.index; $('#cName').textContent = m.title; $('#cEn').textContent = m.en || '';
    markTabs();
    try { history.replaceState(null, '', '#' + m.id); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('in')));
    switching = false;
    return cur;
  }
  $('#prevBtn').onclick = () => { stopTour(); go(curIdx - 1); };
  $('#nextBtn').onclick = () => { stopTour(); go(curIdx + 1); };
  window.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowRight') { stopTour(); go(curIdx + 1); }
    if (e.key === 'ArrowLeft') { stopTour(); go(curIdx - 1); }
    if (e.key === 'Escape') { drawer.isOpen ? drawer.close() : stopTour(); }
  });

  /* ---------- Tour mode ---------- */
  function setTourBtn() {
    const b = $('#tourBtn');
    b.classList.toggle('amber', touring); b.classList.toggle('primary', !touring);
    b.querySelector('span').textContent = touring ? '停止演示' : 'Tour 演示';
    b.querySelector('svg').innerHTML = touring
      ? '<rect x="6" y="6" width="12" height="12" rx="2"/>'
      : '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
  }
  function stopTour(msg) {
    if (!touring) return;
    touring = false; tourToken++; setTourBtn();
    caption(msg || '演示已停止 · 进入手动探索模式', { hint: true, ms: 2600 });
  }
  async function startTour() {
    touring = true; const tok = ++tourToken; setTourBtn();
    const list = modules.map((m, i) => i).filter(i => modules[i].tourable !== false);
    const startAt = 0;
    try {
      for (let k = startAt; k < list.length; k++) {
        if (tok !== tourToken) return;
        tourProgress(k / list.length);
        const c = await go(list[k]);
        if (c.api.reset) c.api.reset();
        await c.ctx.wait(700);
        if (c.api.tour) await c.api.tour(c.ctx, p => tourProgress((k + p) / list.length));
        else { caption(`${c.m.title} · 该章节将在下一步实现`); await c.ctx.wait(2400); }
      }
      tourProgress(1);
      touring = false; tourToken++; setTourBtn();
      caption('演示结束 · 可点击任意章节继续深入探索', { hint: true, ms: 4200 });
    } catch (e) { if (e !== 'cancel') console.error(e); }
  }
  $('#tourBtn').onclick = () => touring ? stopTour() : startTour();
  // 手动交互打断演示
  $('#stage').addEventListener('pointerdown', () => { if (touring) stopTour('检测到手动操作 · 演示已暂停'); }, true);

  /* ---------- boot ---------- */
  function boot() {
    const want = (location.hash || '').slice(1);
    const i = Math.max(0, modules.findIndex(m => m.id === want));
    go(i);
  }

  return { registerModule(def) { modules.push(def); modules.sort((a, b) => a.index - b.index); renderTabs(); }, boot, go, drawer, caption, svg, h, ease };
})();


/* =====================================================================

NPD.registerModule({

            <div class="fb"></div>
          </div>

    ctx.stage.appendChild(root);
    const S$ = s => root.querySelector(s);
    const sv = S$('svg');

    /* ---------- defs ---------- */

    defs.innerHTML = `
      <clipPath id="m1clip"><rect x="${X0}" y="${Y0 - S}" width="${S}" height="${S}"/></clipPath>
      <radialGradient id="m1sweep" cx="0" cy="1" r="1" gradientUnits="objectBoundingBox">

      <linearGradient id="m1beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fd5bf" stop-opacity="0"/><stop offset="1" stop-color="#2fd5bf" stop-opacity=".9"/></linearGradient>
      <filter id="m1glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    // arc strokes w/ draw-in
    const arcs = [R1, R2].map((r, i) => svg('path', {

      pathLength: 100, 'stroke-dasharray': 100, 'stroke-dashoffset': 100
    }, sv));
    // grid
    const grid = svg('g', { stroke: '#273449', 'stroke-dasharray': '3 5' }, sv);
    [1/3, 2/3].forEach(t => { svg('line', { x1: px(t), y1: py(0), x2: px(t), y2: py(1) }, grid); svg('line', { x1: px(0), y1: py(t), x2: px(1), y2: py(t) }, grid); });

    /* ---------- quiz highlight band ---------- */

    svg('text', { x: px(.5), y: py(2/3) - 10, 'text-anchor': 'middle', fill: '#f5a524', 'font-size': 12, 'font-weight': 600, text: '✓ 层次1 与 层次2 边界：未涉及的已有市场 × 未使用的已有方案' }, qz);

    /* ---------- charter boundary (FroliCat / 华为) ---------- */
    const ch = svg('g', { opacity: 0, 'pointer-events': 'none' }, sv);
    const chRect = svg('rect', { x: X0 + 4, y: py(.62), width: .62 * S - 4, height: .62 * S - 4, rx: 10, fill: 'rgba(245,165,36,.05)', stroke: '#f5a524', 'stroke-width': 1.6, 'stroke-dasharray': '8 6' }, ch);
    svg('text', { x: X0 + 14, y: py(.62) + 20, fill: '#f5a524', 'font-size': 11.5, 'font-weight': 600, text: '产品创新章程边界' }, ch);
    svg('text', { x: X0 + 14, y: py(.62) + 36, fill: '#f5a524', 'fill-opacity': .75, 'font-size': 10.5, text: '实体产品 · 已有零售渠道 · 约 1 年' }, ch);

    /* ---------- radar ---------- */

    const wedge = svg('path', { fill: 'url(#m1sweep)' }, radar);
    const beam = svg('line', { x1: X0, y1: Y0, stroke: 'url(#m1beam)', 'stroke-width': 1.5 }, radar);

        explain() { ctx.drawer.open({ tag: 'Step 02 · Interpret Needs', title: '书写需求陈述的五大原则', html: `<ul>${R.map((r, i) => `<li><b>${i + 1}. ${r.t}</b>：${r.s}</li>`).join('')}</ul><h4>矛盾的需求</h4><p>当顾客表达的需求相互矛盾时，团队在该流程中不要试图解决矛盾，只需把两种需求都记下；如何解决留给后续概念开发。</p>` }); },
        async tour(ctx) {

    /* =================================================================
       STEP 3 · 组织需求层级（亲和图）
       ================================================================= */
    function S3(el) {
      const PRI = [{ t: '一级 · 恒温器易于使用', cols: [0, 1], c: C.teal }, { t: '一级 · 恒温器节能舒适', cols: [2], c: C.blue }, { t: '一级 · 恒温器安全可靠', cols: [3], c: C.amber }];
      const SEC = [{ t: '二级 · 易于设置', p: 0 }, { t: '二级 · 便于控制', p: 0 }, { t: '二级 · 自动调节', p: 1 }, { t: '二级 · 安全耐用', p: 2 }];
      const NOTES = [
        ['无须用户设置时间和日期', 0], ['能适应季节的变换', 0], ['适应显示时间和日期的不同偏好', 0],
        ['不需特殊装置即可远程控制', 1], ['可在舒服的位置控制', 1], ['可分开控制加热和制冷', 1],
        ['对用户的出现自动做出反应', 2], ['无人在家时自动节能', 2], ['保持室温稳定', 2],
        ['能安全地控制未授权的接入', 3], ['无须更换电池', 3], ['断电后保留设置', 3],
        ['可以远程控制', 1, true]
      ];
      const SIX = ['在卡片或便笺上写出每条需求陈述', '删除冗余陈述', '按需求相似性归类', '为每个组选择一个标签', '建立包含 2~5 个组的超级组', '评审和编辑组织好的需求'];
      el.innerHTML = head(2, '<span class="h-sub">示例：恒温器需求（三级 → 二级 → 一级）</span>') + `<div class="s3">
        <div class="board"><div class="sweep"></div></div>
        <div class="panel six"><div class="eyebrow">亲和图 · 六步法</div>
          ${SIX.map((s, i) => `<div class="st"><i>${i + 1}</i><span>${s}</span></div>`).join('')}
          <div class="tools" style="margin-top:8px"><button class="btn sm primary" data-a="next">下一步</button><button class="btn sm" data-a="all">一键聚合</button><button class="btn sm" data-a="reset">打散</button></div>
        </div></div>`;
      const board = el.querySelector('.board'), sweep = el.querySelector('.sweep');
      const COLX = [1.5, 26, 50.5, 75];
      const priEls = PRI.map(p => { const e = h(`<div class="gh pri" style="background:${p.c};left:${COLX[p.cols[0]]}%;width:${(p.cols.length * 24.5) - 1}%;top:2%">${p.t}</div>`); board.appendChild(e); return e; });
      const secEls = SEC.map((s, i) => { const e = h(`<div class="gh sec" style="color:${PRI[s.p].c};left:${COLX[i]}%;width:23.5%;top:13%">${s.t}</div>`); board.appendChild(e); return e; });
      const counts = [0, 0, 0, 0];
      const notes = NOTES.map(([t, g, dup]) => {
        const e = h(`<div class="note">${t}<span class="ck">✓</span></div>`); board.appendChild(e);
        const slot = dup ? -1 : counts[g]++;
        return { e, g, dup, slot };
      });
      const st = { k: 0 };
      function scatter() {
        const cells = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) cells.push([c, r]);
        cells.sort(() => Math.random() - .5);
        notes.forEach((n, i) => { const [c, r] = cells[i]; n.sx = 2 + c * 24.5 + (Math.random() - .5) * 5; n.sy = 5 + r * 22 + (Math.random() - .5) * 7; n.rot = (Math.random() - .5) * 14; });
      }
      function apply(k) {
        st.k = k;
        el.querySelectorAll('.six .st').forEach((s, i) => { s.classList.toggle('on', i === k - 1); s.classList.toggle('done', i < k - 1); });
        notes.forEach((n, i) => {
          const grouped = k >= 3;
          n.e.className = 'note' + (k >= 1 ? ' show' : '') + (grouped && !n.dup ? ' g' + SEC[n.g].p : '') + (k >= 2 && n.dup ? ' gone' : '') + (k >= 6 && !n.dup ? ' rv' : '');
          if (grouped && !n.dup) { n.e.style.left = COLX[n.g] + '%'; n.e.style.top = (25 + n.slot * 22) + '%'; n.e.style.transform = 'none'; n.e.style.transitionDelay = (i * .04) + 's'; }
          else { n.e.style.left = n.sx + '%'; n.e.style.top = n.sy + '%'; n.e.style.transform = k >= 1 ? `rotate(${n.rot}deg) scale(.88)` : 'scale(.6)'; n.e.style.transitionDelay = k === 1 ? (i * .05) + 's' : '0s'; }
        });
        secEls.forEach((e, i) => { e.classList.toggle('show', k >= 4); e.style.transitionDelay = (i * .08) + 's'; });
        priEls.forEach((e, i) => { e.classList.toggle('show', k >= 5); e.style.transitionDelay = (i * .12) + 's'; });
        if (k === 2) { const d = notes.find(n => n.dup); d.e.classList.remove('gone'); d.e.classList.add('shake'); later(1000, () => { d.e.classList.remove('shake'); d.e.classList.add('gone'); }); }
        if (k === 6) {
          sweep.style.opacity = 1; let x = 0;
          ctx.tween(1800, p => { sweep.style.left = (COLX[0] + p * (COLX[3] - COLX[0])) + '%'; sweep.style.opacity = p < .9 ? 1 : (1 - p) * 10; }, ctx.ease.io);
        }
      }
      function next() { apply(st.k >= 6 ? 1 : st.k + 1); if (st.k === 1) scatter(), apply(1); }
      async function runAll(wait = (ms) => new Promise(r => later(ms, r))) { scatter(); apply(0); await wait(250); for (let k = 1; k <= 6; k++) { apply(k); await wait(k === 2 ? 1500 : 1300); } }
      el.querySelector('[data-a=next]').onclick = () => { if (st.k === 0 || st.k >= 6) { scatter(); apply(0); later(60, () => apply(1)); } else apply(st.k + 1); };
      el.querySelector('[data-a=all]').onclick = () => runAll();
      el.querySelector('[data-a=reset]').onclick = () => { scatter(); apply(0); later(60, () => apply(1)); };
      scatter(); apply(0); later(120, () => apply(1));
      return {
        explain() { ctx.drawer.open({ tag: 'Step 03 · Organize Hierarchy', title: '组织用户需求的层级', html: '<p>当详细的需求数量十分大时，处理和总结都很困难，因此把需求组织为<b>一级 / 二级 / 三级</b>的层级结构。</p><h4>六步法（亲和图）</h4><ul>' + SIX.map(s => `<li>${s}</li>`).join('') + '</ul><p style="color:var(--muted)">页面中的恒温器需求条目为教学示例。</p>' }); },
        async tour(ctx) {
          const caps = ['第三步：把每条需求写在便笺上——此时它们是散落的三级需求。', '删除冗余："可以远程控制"与已有陈述重复。', '按相似性归类：便笺自动磁吸到各自的组。', '为每个组选择标签——形成二级需求。', '建立包含 2~5 个组的超级组——一级需求。', '最后评审和编辑整个需求层级。'];
          scatter(); apply(0); await ctx.wait(300);
          for (let k = 1; k <= 6; k++) { ctx.caption(caps[k - 1]); apply(k); await ctx.wait(k === 1 ? 2600 : 2400); }
        }

        async tour(ctx) {
          show('kano'); await ctx.wait(500);

          sub.select('must'); ctx.caption('必备需求：如手机通信信号——偶尔出问题就不能接受，但做得再好也不会触发购买。'); await sub.slide(-1, 1, 2600); await ctx.wait(1400);
          sub.select('one'); ctx.caption('期望需求：如运行速度——越好越满意，大致线性。'); await ctx.wait(3000);

          sub.brand('B'); ctx.caption('B 品牌外观满意度低 → 落入重点改进区，研发资源随之重新分配。'); await ctx.wait(4400);

    function KANO(host) {

        <div style="display:flex;align-items:center;gap:12px;padding:4px 6px"><span class="eyebrow" style="white-space:nowrap">需求实现程度</span><input type="range" class="rng" min="-1000" max="1000" value="-600"><span class="sv mono" style="color:var(--teal);font-size:12px;min-width:40px;text-align:right"></span></div></div>
        <div class="side"><div class="panel kinfo"></div>
          <div class="panel kinfo"><div class="eyebrow">同等重要，影响却不同 · 智能手机</div>
            <div class="cbar"><span>通信信号</span><span class="tr"><i data-b="must"></i></span><b data-v="must"></b></div>
            <div class="cbar"><span>运行速度</span><span class="tr"><i data-b="one"></i></span><b data-v="one"></b></div>
            <p style="color:var(--muted);font-size:11.5px">拖动滑块：同样从"不足"到"充足"，两项对满意度的影响呈现不同的非线性。</p></div></div>`;
      const sv = host.querySelector('svg');

        one: { n: '期望需求', en: 'One-dimensional', c: C.blue, f: x => .82 * x, d: '满意度与实现程度大致成正比：越好越满意，越差越不满。', ex: '智能手机运行速度：越快越满意，卡顿会直接降低满意度。' },
        must: { n: '必备需求', en: 'Must-be', c: C.amber, f: x => -Math.exp(-2.3 * (x + 1)) * .95, d: '不具备时极度不满；做得再好也只能消除不满，不会带来额外满意。', ex: '智能手机通信信号：偶尔出问题都不能接受，但通话流畅不会触发购买。' },
        ind: { n: '无差异需求', en: 'Indifferent', c: C.slate, f: x => .03 * x, d: '无论是否具备，用户满意度基本不变。', ex: '用户并不在意的特征——不值得投入资源。' },

      };
      svg('rect', { x: X(-1), y: Y(1), width: SX * 2, height: SY * 2, fill: 'none', stroke: '#1c2738' }, sv);
      svg('line', { x1: X(-1), y1: OY, x2: X(1) + 14, y2: OY, stroke: '#5b677a', 'stroke-width': 1.4 }, sv);
      svg('line', { x1: OX, y1: Y(-1), x2: OX, y2: Y(1) - 14, stroke: '#5b677a', 'stroke-width': 1.4 }, sv);
      [['满意', OX + 8, Y(1) - 4, 'start'], ['不满意', OX + 8, Y(-1) - 8, 'start'], ['充足 / 具备 →', X(1), Y(-1) + 18, 'end'], ['← 不充足 / 不具备', X(-1), Y(-1) + 18, 'start']]
        .forEach(([t, x, y, a]) => svg('text', { x, y, 'text-anchor': a, fill: '#8a97aa', 'font-size': 11.5, text: t }, sv));
      const pth = f => { let d = ''; for (let i = 0; i <= 100; i++) { const x = -1 + i / 50; d += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(f(x)).toFixed(1); } return d; };
      const lines = {}, dots = {};
      const lg = host.querySelector('.legend-row');
      Object.entries(K).forEach(([k, v]) => {

        svg('path', { d: pth(v.f), fill: 'none', stroke: 'transparent', 'stroke-width': 18 }, g);
        const lx = k === 'must' ? 1 : k === 'rev' ? -1 : 1, ly = v.f(lx);
        svg('text', { x: X(lx) + (lx > 0 ? -4 : 4), y: Y(ly) + (k === 'must' ? 16 : k === 'ind' ? -8 : k === 'rev' ? -10 : -8), 'text-anchor': lx > 0 ? 'end' : 'start', fill: v.c, 'font-size': 12, 'font-weight': 600, text: v.n }, g);
        dots[k] = svg('circle', { r: 5, fill: '#0b111b', stroke: v.c, 'stroke-width': 2.5 }, sv);
        g.addEventListener('click', () => select(k));
        lg.insertAdjacentHTML('beforeend', `<span><i style="background:${v.c}"></i>${v.en}</span>`);
      });
      const vl = svg('line', { y1: Y(1), y2: Y(-1), stroke: '#e7edf5', 'stroke-opacity': .25, 'stroke-dasharray': '3 4' }, sv);
      const info = host.querySelector('.kinfo'), rng = host.querySelector('.rng'), sv2 = host.querySelector('.sv');
      let selK = null;

        selK = k; const v = K[k];
        Object.entries(lines).forEach(([kk, l]) => { l.setAttribute('stroke-width', kk === k ? 4 : 2); l.style.opacity = kk === k ? 1 : .35; });
        info.style.setProperty('--accent', v.c);

      }

        ['must', 'one'].forEach(k => {
          const val = K[k].f(x), i = host.querySelector(`[data-b=${k}]`);
          i.style.background = K[k].c; i.style.left = val >= 0 ? '50%' : (50 + val * 50) + '%'; i.style.width = Math.abs(val) * 50 + '%';
          host.querySelector(`[data-v=${k}]`).textContent = (val >= 0 ? '+' : '') + val.toFixed(2);
        });

      function slide(a, b, ms) { return ctx.tween(ms, p => setX(a + (b - a) * p)); }
      select('must'); setX(-.6); anim();
      return { select, slide, anim };
    }

    function IPA(host) {

        { n: '外观设计', I: 4.3, A: 4.4, B: 2.1 }, { n: '动力性能', I: 3.9, A: 3.6, B: 3.9 }, { n: '油耗经济', I: 4.1, A: 2.6, B: 3.7 },
        { n: '车机系统', I: 3.6, A: 2.5, B: 2.9 }, { n: '内饰质感', I: 2.6, A: 4.1, B: 3.0 }, { n: '音响配置', I: 1.9, A: 3.9, B: 3.6 }, { n: '售后网点', I: 2.4, A: 2.3, B: 2.0 }
      ];
      const QD = {
        keep: { n: '维持区', c: C.teal, s: '高重要 · 高绩效：继续保持优势。', w: 1.4 },
        over: { n: '过度关心区', c: C.slate, s: '低重要 · 高绩效：投入可能过度，可适度回收资源。', w: .35 },
        fix: { n: '重点改进区', c: C.red, s: '高重要 · 低绩效：优先投入研发资源。', w: 3.2 },
        low: { n: '较低价值区', c: C.blue, s: '低重要 · 低绩效：低优先级，择机改进。', w: .6 }
      };
      host.innerHTML = `<div class="panel plot"><div style="display:flex;justify-content:space-between;align-items:center"><div class="eyebrow">IPA 重要性-绩效分析 · 汽车示例</div><div class="seg-ctl"><button data-b="A" class="on">A 品牌</button><button data-b="B">B 品牌</button></div></div><svg viewBox="0 0 600 420"></svg></div>
        <div class="side"><div class="panel kinfo"></div><div class="panel kinfo alloc"><div class="eyebrow">研发资源再分配</div><div class="rows"></div></div></div>`;
      const sv = host.querySelector('svg');
      const X0 = 70, Y0 = 370, PW = 500, PH = 340, MN = 1.5, MX = 5, MID = 3.2;
      const X = v => X0 + (v - MN) / (MX - MN) * PW, Y = v => Y0 - (v - MN) / (MX - MN) * PH;
      const quad = (I, A) => I >= MID ? (A >= MID ? 'keep' : 'fix') : (A >= MID ? 'over' : 'low');
      [['over', X0, Y(MX), X(MID) - X0, Y(MID) - Y(MX)], ['keep', X(MID), Y(MX), X(MX) - X(MID), Y(MID) - Y(MX)], ['low', X0, Y(MID), X(MID) - X0, Y0 - Y(MID)], ['fix', X(MID), Y(MID), X(MX) - X(MID), Y0 - Y(MID)]]
        .forEach(([k, x, y, w, hh]) => {
          svg('rect', { x, y, width: w, height: hh, fill: QD[k].c, 'fill-opacity': .07 }, sv);
          svg('text', { x: x + (k === 'over' || k === 'low' ? 12 : w - 12), y: k === 'over' || k === 'keep' ? y + 22 : y + hh - 12, 'text-anchor': k === 'over' || k === 'low' ? 'start' : 'end', fill: QD[k].c, 'font-size': 13, 'font-weight': 700, text: QD[k].n }, sv);
        });
      svg('line', { x1: X(MID), y1: Y(MX), x2: X(MID), y2: Y0, stroke: '#5b677a', 'stroke-dasharray': '5 4' }, sv);
      svg('line', { x1: X0, y1: Y(MID), x2: X(MX), y2: Y(MID), stroke: '#5b677a', 'stroke-dasharray': '5 4' }, sv);
      svg('line', { x1: X0, y1: Y0, x2: X(MX) + 10, y2: Y0, stroke: '#5b677a' }, sv); svg('line', { x1: X0, y1: Y0, x2: X0, y2: Y(MX) - 10, stroke: '#5b677a' }, sv);
      svg('text', { x: X(MX), y: Y0 + 22, 'text-anchor': 'end', fill: '#8a97aa', 'font-size': 11.5, text: '重要度 Importance →' }, sv);
      svg('text', { x: 22, y: Y(3.25), 'text-anchor': 'middle', fill: '#8a97aa', 'font-size': 11.5, transform: `rotate(-90 22 ${Y(3.25)})`, text: '绩效表现 Performance →' }, sv);
      const pts = ATT.map((a, i) => {
        const g = svg('g', { class: 'ipt' }, sv);
        const halo = svg('circle', { r: a.n === '外观设计' ? 16 : 0, fill: 'none', stroke: C.amber, 'stroke-opacity': .6, 'stroke-dasharray': '3 3' }, g);
        const c = svg('circle', { r: a.n === '外观设计' ? 8 : 6, fill: '#0b111b', 'stroke-width': 2.5 }, g);
        const t = svg('text', { x: 11, y: 4, fill: '#dbe4ef', 'font-size': 11.5, text: a.n }, g);
        g.addEventListener('click', () => focus(i));
        return { a, g, c, x: X(a.I), y: Y(a.A) };
      });
      const info = host.querySelectorAll('.kinfo')[0], rows = host.querySelector('.alloc .rows');
      const bars = ATT.map(a => { const r = h(`<div class="row"><span>${a.n}</span><span class="tr"><i></i></span><b></b></div>`); rows.appendChild(r); return r; });
      let brandK = 'A', focusI = 0;
      function place() {
        pts.forEach(p => { const q = quad(p.a.I, p.a[brandK]); p.c.setAttribute('stroke', QD[q].c); p.g.setAttribute('transform', `translate(${p.x},${p.y})`); });
        const ws = ATT.map(a => QD[quad(a.I, a[brandK])].w * a.I); const sum = ws.reduce((s, v) => s + v, 0);
        bars.forEach((r, i) => { const q = quad(ATT[i].I, ATT[i][brandK]); const pc = ws[i] / sum * 100; r.querySelector('i').style.width = pc * 2.2 + '%'; r.querySelector('i').style.background = QD[q].c; r.querySelector('b').textContent = pc.toFixed(0) + '%'; });
      }
      function focus(i) {
        focusI = i; const a = ATT[i], q = quad(a.I, a[brandK]);
        info.innerHTML = `<div class="eyebrow" style="color:${QD[q].c}">${brandK} 品牌 · ${QD[q].n}</div><h4>${a.n}</h4><p>${QD[q].s}</p><div class="ex">重要度 ${a.I.toFixed(1)} · 绩效 ${a[brandK].toFixed(1)}</div>${a.n === '外观设计' ? '<p style="font-size:11.5px;color:var(--muted)">同样重视外观，A 品牌满意度高、B 品牌满意度低——不同的绩效表现需要不同的策略。</p>' : ''}`;
        info.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350 });
      }
      function brand(k) {
        brandK = k; host.querySelectorAll('[data-b]').forEach(b => b.classList.toggle('on', b.dataset.b === k));
        const from = pts.map(p => [p.x, p.y]);
        ctx.tween(1000, t => pts.forEach((p, i) => { p.x = from[i][0]; p.y = from[i][1] + (Y(p.a[k]) - from[i][1]) * t; p.g.setAttribute('transform', `translate(${p.x},${p.y})`); }));
        place(); focus(focusI);
      }
      host.querySelectorAll('[data-b]').forEach(b => b.onclick = () => brand(b.dataset.b));
      place(); focus(0);
      return { brand };
    }

    /* =================================================================
       STEP 5 · 流程与结果反思
       ================================================================= */
    function S5(el) {
      const QS = ['我们是否与目标市场上所有主要顾客都进行了交流？', '为了捕捉潜在需求，我们能否看到现有产品相关需求之外的需求？', '在跟踪访谈或调查中，是否还有应继续探究的领域？', '在交谈过的顾客中，哪些适合参与即将开展的开发活动？', '哪些是我们现在知道而开始时不知道的？是否对某些需求感到惊讶？', '我们的组织中是否包括那些需要深入理解顾客需求的人？', '我们该怎样完善未来活动的流程？'];
      el.innerHTML = head(4, '<button class="btn sm" data-all>全部勾选</button><button class="btn sm" data-clr>清空</button>') + `<div class="s5">
        <div class="panel ringp"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="74" fill="none" stroke="#1c2738" stroke-width="12"/>
          <circle class="arc" cx="90" cy="90" r="74" fill="none" stroke="url(#m5g)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 90 90)" style="transition:stroke-dasharray .6s cubic-bezier(.22,.8,.24,1)"/>
          <defs><linearGradient id="m5g" x1="0" x2="1"><stop offset="0" stop-color="${C.blue}"/><stop offset="1" stop-color="${C.teal}"/></linearGradient></defs>
          <text class="pct" x="90" y="96" text-anchor="middle" fill="#e7edf5" font-size="34" font-weight="700" font-family="JetBrains Mono, monospace">0/7</text>
          <text x="90" y="120" text-anchor="middle" fill="#8a97aa" font-size="11">项目自查</text></svg>
          <div class="h-sub done-msg">识别顾客需求可以结构化，但并不是一门精确的科学——团队必须不断挑战自己的结果。</div></div>
        <div class="clist">${QS.map((q, i) => `<button class="ci" style="animation-delay:${i * .07}s"><span class="bx"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>${q}</span></button>`).join('')}</div></div>`;
      const items = [...el.querySelectorAll('.ci')];
      function upd() {
        const n = items.filter(i => i.classList.contains('on')).length;
        el.querySelector('.arc').setAttribute('stroke-dasharray', `${n / 7 * 100} 100`);
        el.querySelector('.pct').textContent = `${n}/7`;
        el.querySelector('.done-msg').innerHTML = n === 7 ? '<b style="color:var(--teal)">✓ 自查完成</b>：带着这些答案进入目标规格与概念生成阶段。' : '识别顾客需求可以结构化，但并不是一门精确的科学——团队必须不断挑战自己的结果。';
      }
      items.forEach(i => i.onclick = () => { i.classList.toggle('on'); upd(); });
      el.querySelector('[data-all]').onclick = () => items.forEach((i, k) => later(k * 160, () => { i.classList.add('on'); upd(); }));
      el.querySelector('[data-clr]').onclick = () => { items.forEach(i => i.classList.remove('on')); upd(); };
      return {
        explain() { ctx.drawer.open({ tag: 'Step 05 · Reflect', title: '对结果和过程进行反思', html: '<p>虽然识别顾客需求的流程可以非常实用地结构化，但它并不是一门精确的科学。团队必须不断挑战自己的结果，确认它们与通过大量顾客沟通所积累的知识相一致。</p><h4>要问的问题</h4><ul>' + QS.map(q => `<li>${q}</li>`).join('') + '</ul>' }); },
        async tour(ctx) {
          ctx.caption('第五步：对结果和过程进行反思——逐项自查。');
          for (let k = 0; k < 7; k++) { await ctx.wait(650); items[k].classList.add('on'); upd(); }
          await ctx.wait(2000);
        }
      };
    }

    const BUILD = [S1, S2, S3, S4, S5];

    /* ---------- console ---------- */
    const bPrev = h('<button class="btn sm">← 上一步</button>');
    const bNext = h('<button class="btn sm primary">下一步 →</button>');
    ctx.on(bPrev, 'click', () => goStep(cur - 1));
    ctx.on(bNext, 'click', () => goStep(cur + 1));
    ctx.console.append(bPrev, bNext);

    goStep(0);

    return {
      reset() { goStep(0); },
      unmount() { clearStep(); },
      async tour(ctx, prog) {
        for (let i = 0; i < 5; i++) {
          prog(i / 5); goStep(i); await ctx.wait(700);
          if (api.tour) await api.tour(ctx);
        }
        prog(1);
      }
    };
  }
});


NPD.boot();
</script>
</body>
